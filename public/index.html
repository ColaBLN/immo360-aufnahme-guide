<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#143758">
<title>Immo360° Aufnahme-Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@300;400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
<style>
:root{
  --blue:#143758; --blue-2:#1d4a74; --yellow:#F7C047;
  --bg:#F5F6F8; --card:#FFFFFF; --text:#143758; --muted:#6B7A8C; --line:#E3E7EC;
  --r:18px;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#0d2238;font-family:"Source Sans 3",system-ui,sans-serif;color:var(--text)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
#app{position:relative;max-width:440px;height:100%;margin:0 auto;overflow:hidden;background:var(--bg)}
@media(min-width:600px){#app{height:min(900px,calc(100% - 40px));margin-top:20px;border-radius:36px;box-shadow:0 30px 80px rgba(0,0,0,.35)}}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;transition:opacity .35s ease,transform .35s ease}
.hidden{opacity:0;pointer-events:none;transform:scale(1.03)}

/* ---------- Sperrbildschirm ---------- */
#lock{background:radial-gradient(120% 80% at 50% 0%,#24557f 0%,var(--blue) 55%,#0c2640 100%);color:#fff;align-items:center;padding:calc(var(--st) + 48px) 24px calc(var(--sb) + 28px)}
.lk-brand{font-weight:600;letter-spacing:.18em;font-size:13px;opacity:.75;text-transform:uppercase}
.lk-brand b{color:var(--yellow)}
.lk-time{font-size:84px;font-weight:300;line-height:1;margin-top:18px;letter-spacing:-.02em}
.lk-date{font-size:17px;opacity:.8;margin-top:6px}
.lk-hint{margin-top:auto;font-size:15px;opacity:.85}
.dots{display:flex;gap:18px;margin:16px 0 30px}
.dots span{width:13px;height:13px;border-radius:50%;border:1.5px solid rgba(255,255,255,.85);transition:background .15s}
.dots span.on{background:#fff}
.dots.err{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.pad{display:grid;grid-template-columns:repeat(3,78px);gap:16px 26px}
.key{width:78px;height:78px;border-radius:50%;background:rgba(255,255,255,.12);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:32px;font-weight:300;transition:background .1s}
.key:active{background:rgba(255,255,255,.32)}
.key small{font-size:9px;letter-spacing:.2em;font-weight:600;opacity:.7;margin-top:-2px}
.key.ghost{background:none;font-size:16px;font-weight:400}

/* ---------- Homescreen ---------- */
#home{background:linear-gradient(180deg,var(--blue) 0,var(--blue) 210px,var(--bg) 210px)}
.hm-head{padding:calc(var(--st) + 22px) 22px 0;color:#fff;display:flex;justify-content:space-between;align-items:flex-start}
.hm-head h1{font-size:28px;font-weight:700;line-height:1.1}
.hm-head h1 span{color:var(--yellow)}
.hm-head p{opacity:.75;font-size:15px;margin-top:4px}
.icon-btn{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center}
.grid{flex:1;overflow:auto;padding:26px 18px calc(var(--sb) + 24px);display:grid;grid-template-columns:1fr 1fr;gap:14px;align-content:start}
.tile{background:var(--card);border-radius:var(--r);padding:16px;min-height:132px;display:flex;flex-direction:column;text-align:left;box-shadow:0 2px 10px rgba(20,55,88,.07);position:relative;transition:transform .12s}
.tile:active{transform:scale(.97)}
.tile.wide{grid-column:span 2;min-height:118px;background:var(--card);border:2px solid var(--yellow);box-shadow:0 8px 24px rgba(20,55,88,.18)}
.tile .ic{width:44px;height:44px;border-radius:13px;background:#EEF2F6;display:flex;align-items:center;justify-content:center;margin-bottom:auto}
.tile.wide .ic{background:var(--blue)}
.tile .ic svg{width:24px;height:24px;stroke:var(--blue);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tile.wide .ic svg{stroke:var(--yellow)}
.tile .no{position:absolute;top:16px;right:16px;font-size:13px;font-weight:600;color:var(--muted)}
.tile.wide .no{color:var(--muted)}
.tile h3{font-size:17px;font-weight:700;margin-top:14px;line-height:1.15}
.tile p{font-size:13px;color:var(--muted);margin-top:2px}

.bar{height:4px;border-radius:2px;background:var(--line);margin-top:10px;overflow:hidden}

.bar i{display:block;height:100%;width:0;background:var(--yellow);transition:width .3s}

/* ---------- Modul ---------- */
#module{background:var(--bg)}
.md-head{background:var(--blue);color:#fff;padding:calc(var(--st) + 14px) 18px 0}
.md-top{display:flex;align-items:center;gap:10px}
.md-top .back{display:flex;align-items:center;gap:4px;font-size:16px;opacity:.9;padding:6px 6px 6px 0}
.md-top .back svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2}
.md-head h2{font-size:26px;font-weight:700;margin:10px 0 2px}
.md-head .sub{opacity:.75;font-size:15px}
.tabs{display:flex;gap:4px;margin-top:18px}
.tab{flex:1;padding:12px 0 14px;font-size:15px;font-weight:600;opacity:.6;border-bottom:3px solid transparent}
.tab.on{opacity:1;border-color:var(--yellow)}
.md-body{flex:1;overflow:auto;padding:20px 18px calc(var(--sb) + 28px)}
.panel{display:none}.panel.on{display:block}

.card{background:var(--card);border-radius:var(--r);padding:18px;box-shadow:0 2px 10px rgba(20,55,88,.06);margin-bottom:14px}
.card h4{font-size:18px;margin-bottom:6px}
.card p,.card li{font-size:16px;line-height:1.45;color:#2b4560}
.card ul{padding-left:18px;margin-top:6px}
.card li{margin:4px 0}
.lead{font-size:18px;line-height:1.45;margin-bottom:16px}
.tip{border-left:4px solid var(--yellow);background:#FFF8E6}
.tip h4{display:flex;gap:8px;align-items:center}
.ph{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:#EEF2F6;color:var(--muted);padding:3px 8px;border-radius:6px;margin-bottom:14px}

/* Schritte */
.steps{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:12px;margin:0 -18px;padding:0 18px 4px;scrollbar-width:none}
.steps::-webkit-scrollbar{display:none}
.step{flex:0 0 100%;scroll-snap-align:center;background:var(--card);border-radius:22px;padding:22px;box-shadow:0 2px 12px rgba(20,55,88,.08);min-height:380px;display:flex;flex-direction:column}
.step .num{width:44px;height:44px;border-radius:50%;background:var(--blue);color:var(--yellow);font-weight:700;font-size:20px;display:flex;align-items:center;justify-content:center}
.step h4{font-size:22px;margin:16px 0 8px;line-height:1.15}
.step p{font-size:16px;line-height:1.5;color:#2b4560}
.step ul{margin-top:10px;padding-left:18px}.step li{font-size:16px;line-height:1.45;color:#2b4560;margin:3px 0}
.step .tip{margin-top:auto;padding:12px 14px;border-radius:12px;font-size:15px;line-height:1.4}
.stepnav{display:flex;align-items:center;justify-content:space-between;margin-top:16px}
.sdots{display:flex;gap:6px}
.sdots span{width:7px;height:7px;border-radius:4px;background:#C9D2DC;transition:all .2s}
.sdots span.on{width:22px;background:var(--blue)}
.btn{background:var(--blue);color:#fff;padding:12px 20px;border-radius:14px;font-weight:600;font-size:16px}
.btn.light{background:#E7ECF2;color:var(--blue)}
.btn:disabled{opacity:.35}

/* Checkliste */
.cl-prog{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.cl-prog .bar{flex:1;height:8px;margin:0;border-radius:4px}
.cl-prog b{font-size:15px;min-width:52px;text-align:right}
.group{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:20px 4px 8px}
.group:first-of-type{margin-top:0}
.check{display:flex;align-items:center;gap:14px;width:100%;background:var(--card);padding:15px 16px;border-radius:14px;margin-bottom:8px;text-align:left;font-size:16px;line-height:1.3;box-shadow:0 1px 4px rgba(20,55,88,.05)}
.check .box{flex:0 0 28px;height:28px;border-radius:9px;border:2px solid #C9D2DC;display:flex;align-items:center;justify-content:center;transition:all .15s}
.check .box svg{width:16px;height:16px;stroke:var(--blue);stroke-width:3;fill:none;opacity:0}
.check.done .box{background:var(--yellow);border-color:var(--yellow)}
.check.done .box svg{opacity:1}
.check.done span{color:var(--muted);text-decoration:line-through}
.reset{display:block;margin:18px auto 0;color:var(--muted);font-size:15px;text-decoration:underline}


.hl{background:var(--card);border-radius:14px;margin-bottom:8px;box-shadow:0 1px 4px rgba(20,55,88,.05);overflow:hidden}
.hl-head{display:flex;align-items:center;gap:10px;width:100%;padding:15px 16px;text-align:left}
.hl-n{flex:1;font-size:17px;font-weight:600}
.pill{font-size:12px;font-weight:700;background:#FFF3D6;color:#8a6410;padding:4px 9px;border-radius:20px;white-space:nowrap}
.chev{width:20px;height:20px;stroke:var(--muted);fill:none;stroke-width:2;transition:transform .2s}
.hl.open .chev{transform:rotate(180deg)}
.hl-body{display:none;padding:0 16px 16px;border-top:1px solid var(--line)}
.hl.open .hl-body{display:block}
.hl-sec{margin-top:14px}
.hl-sec>b{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.hl-sec p,.hl-sec li{font-size:16px;line-height:1.45;color:#2b4560}
.hl-sec ul{padding-left:18px;margin-top:4px}
.dev{margin-top:8px}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:6px}
.badge.mp{background:var(--blue);color:#fff}.badge.sp{background:#E7ECF2;color:var(--blue)}
.hl .tip{margin-top:14px}

.fig{margin:0 0 14px;background:var(--card);border-radius:var(--r);overflow:hidden;box-shadow:0 2px 10px rgba(20,55,88,.06)}
.fig img{display:block;width:100%;height:auto;cursor:zoom-in}
.fig figcaption{padding:10px 14px;font-size:14px;color:var(--muted)}
.step-img{display:block;width:100%;border-radius:12px;margin-top:14px;cursor:zoom-in}
.zoom{position:absolute;inset:0;background:rgba(8,20,34,.94);z-index:10;display:flex;align-items:center;justify-content:center;padding:16px}
.zoom.hidden{display:none}
.zoom img{max-width:100%;max-height:100%;border-radius:8px}
.zoom span{position:absolute;top:calc(var(--st) + 14px);right:18px;color:#fff;font-size:15px;opacity:.8}
.diag{width:100%;height:auto;margin-top:6px}
.fld{display:block;margin-top:12px}
.fld span{display:block;font-size:14px;color:var(--muted);margin-bottom:4px}
.fld input{width:100%;font:inherit;font-size:17px;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;color:var(--text);background:#FAFBFC}
.fld input:focus{outline:none;border-color:var(--blue)}
.seg{display:flex;background:#EEF2F6;border-radius:12px;padding:4px;margin-top:14px}
.seg button{flex:1;padding:10px 0;border-radius:9px;font-size:15px;font-weight:600;color:var(--muted)}
.seg button.on{background:#fff;color:var(--blue);box-shadow:0 1px 4px rgba(20,55,88,.12)}
.res{margin-top:14px}
.rz{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px}
.rz span{color:#2b4560}.rz b{white-space:nowrap}
.rz.tot{border:0;font-size:18px;padding-top:12px}.rz.tot b{color:var(--blue);background:#FFF3D6;padding:4px 10px;border-radius:8px}
.hint{font-size:14px;color:var(--muted);margin-top:10px}
.warn{font-size:15px;color:#b23b2a;margin-top:10px}
.x{margin-left:8px;color:var(--muted);font-size:14px}

.cta{grid-column:span 2;display:flex;align-items:center;justify-content:center;gap:10px;background:var(--yellow);color:var(--blue);font-weight:700;font-size:17px;padding:15px;border-radius:var(--r);box-shadow:0 4px 14px rgba(247,192,71,.35)}
.cta svg{width:20px;height:20px;stroke:var(--blue);stroke-width:3;fill:none}
.cta small{font-size:13px;background:rgba(20,55,88,.12);padding:2px 8px;border-radius:10px}
.btn.yellow{background:var(--yellow);color:var(--blue)}
.fld textarea{width:100%;font:inherit;font-size:16px;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;color:var(--text);background:#fff;resize:vertical}
.fld textarea:focus{outline:none;border-color:var(--blue)}
/* Platzhalter-Modul */
.soon{text-align:center;padding:50px 20px;color:var(--muted)}
.soon .ic{width:72px;height:72px;margin:0 auto 18px;border-radius:22px;background:#E7ECF2;display:flex;align-items:center;justify-content:center}
.soon svg{width:34px;height:34px;stroke:var(--blue);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.soon h4{color:var(--blue);font-size:20px;margin-bottom:6px}

/* Dialog */
.dlg{position:absolute;inset:0;background:rgba(12,30,50,.45);display:flex;align-items:flex-end;z-index:9}
.dlg.hidden{display:none}
.sheet{background:#fff;width:100%;border-radius:24px 24px 0 0;padding:24px 20px calc(var(--sb) + 22px)}
.sheet h4{font-size:19px;margin-bottom:6px}.sheet p{color:var(--muted);margin-bottom:18px}
.sheet .row{display:flex;gap:10px}.sheet .row .btn{flex:1}
</style>
</head>
<body>
<div id="app">

  <!-- Homescreen -->
  <section id="home" class="screen">
    <div class="hm-head">
      <div><h1>Immo<span>360°</span></h1><p>Aufnahme-Guide für Makler &amp; Marketing</p></div>
      <button class="icon-btn" id="lockBtn" aria-label="Abmelden und sperren">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
      </button>
    </div>
    <div class="grid" id="grid"></div>
  </section>

  <!-- Modul -->
  <section id="module" class="screen hidden">
    <div class="md-head">
      <div class="md-top"><button class="back" id="backBtn"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>Übersicht</button></div>
      <h2 id="mdTitle"></h2>
      <div class="sub" id="mdSub"></div>
      <div class="tabs" id="tabs">
      </div>
    </div>
    <div class="md-body" id="mdBody"></div>
  </section>

  <div class="zoom hidden" id="zoom"><span>Schließen ✕</span><img id="zoomImg" alt=""></div>
  <div class="dlg hidden" id="dlg"><div class="sheet">
    <h4 id="dlgH"></h4><p id="dlgP"></p>
    <div class="row"><button class="btn light" id="dlgNo">Abbrechen</button><button class="btn" id="dlgYes">Zurücksetzen</button></div>
  </div></div>
</div>

<script>

/* ---------- Icons ---------- */
const I = {
  termin:'<path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/>',
  highlight:'<path d="M12 3l2.6 5.6 6 .7-4.5 4.1 1.2 6L12 16.5 6.7 19.4l1.2-6L3.4 9.3l6-.7z"/>',
  foto:'<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>',
  metaport:'<circle cx="12" cy="12" r="8"/><ellipse cx="12" cy="12" rx="8" ry="3"/><path d="M12 4v16"/>',
  magicplan:'<path d="M4 4h16v16H4z"/><path d="M4 12h7v8M11 4v5M15 12h5"/>',
  smartphone:'<rect x="7" y="3" width="10" height="18" rx="2"/><path d="M11 18h2"/>',
  flaeche:'<path d="M3 20h18M5 20V10l7-6 7 6v10"/><path d="M9 20v-5h6v5"/>',
  soon:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'
};
const svg = k => `<svg viewBox="0 0 24 24">${I[k]}</svg>`;

/* ---------- Inhalte (Platzhalter – werden mit euren Inhalten ersetzt) ---------- */
const MODULES = [
 { id:'termin', no:1, title:'Termin vor Ort', sub:'Der Ablauf vom Ankommen bis zum Upload', icon:'termin', wide:true, abschluss:true,
   verstehen:{
     lead:'Eigennutzer entscheiden emotional. Wir zeigen die Highlights – mit wenigen, ausdrucksstarken Bildern, die neugierig machen und zur Anfrage des iEx führen.',
     cards:[
       {h:'Für wen fotografieren wir?', p:'Für Eigennutzer – und die kaufen mit dem Herzen:', list:['Südbalkon mit Blick über die Stadt → <b>Exklusivität</b>','Terrasse zum Grillen mit Freunden → <b>Träumen</b>','Garten zum Toben mit den Kindern → <b>Sicherheit & Familie</b>']},
       {h:'Was wir womit aufnehmen', list:['<b>Matterport Pro2:</b> Standardfall. Der 3D-Rundgang liefert gleichzeitig alle Innenfotos inkl. Balkon & Terrasse','<b>Smartphone:</b> Außenansicht, Mikrolage, Details, Herobild','<b>Mehrfamilienhaus:</b> nur Smartphone, keine 3D-Tour','<b>Magicplan (iPad):</b> Aufmaß & Grundriss']},
       {h:'Equipment', list:['Koffer mit Kamera & Ladekabeln','iPad Pro mit Lidar-Sensor','Stativ, Stativkopf & Schnellwechselplatte','Bluetooth-Laser von Bosch','Smartphone']},
       {h:'Licht – Tageslicht!', p:'Räume sollen möglichst groß und hell wirken.', list:['Vorhänge auf, Jalousien hoch','Deckenlampen aus','Zimmertüren öffnen']},
       {h:'Wetter', list:['Im Winter sind die Tage kurz – Zeit einplanen','Vorher in den Wetterbericht schauen','Ohne Balkon spielt das Wetter kaum eine Rolle','Eigentümer nach eigenen Sommerfotos fragen','Außenfotos ggf. beim Besichtigungstermin nachholen']},
       {h:'Haustiere', list:['Vorab mit den Eigentümern sprechen','Fragen, was möglich ist: Korb & Napf beiseite? Spaziergang während der Aufnahme?','Den Fressnapf nie selbst anfassen – Hunde verstehen da keinen Spaß']},
       {h:'Bei Fragen', p:'Cola · 0173 / 770 15 19'}
     ],
     tip:{h:'Merksatz', p:'Der erste Eindruck ist entscheidend, der letzte bleibt im Kopf!'}
   },
   steps:[
     {h:'Vor dem Termin', p:'Planen, prüfen, laden.', list:['Termin in den Kalender, Verfügbarkeit des Equipments prüfen','Equipment auf Vollständigkeit prüfen','Alle Akkus laden','Wetterbericht checken','Eigentümer: Haustiere klären, Vorbereitungstipps schicken'], tip:'Im Winter früh am Tag einplanen – das Tageslicht ist knapp.'},
     {h:'Ankommen & Highlights finden', p:'Erst schauen, was die Immobilie besonders macht.', list:['Balkon, Terrasse, Garten, Pool','Altbau-Fußböden, Stuck, hohe Decken, Kamin','Besondere Ausstattung: Sauna, PV-Anlage, Fahrstuhl …','Eigentümer nach Sommerfotos fragen'], tip:'Das Highlight wird das Herobild – der erste Eindruck im Portal.'},
     {h:'Licht & Innenräume', p:'Groß, hell, aufgeräumt.', list:['Gardinen & Jalousien auf, Deckenlampen aus','Zimmertüren öffnen','Persönliches minimieren, Schuhe & Jacken ordnen','Fernbedienungen verstecken, Kabel weg','Zeitschriften & Bücher weg','Bett machen, ggf. Tagesdecke'], tip:'Ausnahme Licht: Flur, Küchenunterbau-Lampen oder Deckenspots dürfen an.'},
     {h:'Bad & Küche', p:'Leere Flächen wirken größer.', list:['Arbeitsflächen leeren & säubern','Geschirr wegpacken','Geschirrtücher & Spülmittel weg – auch nicht am Ofen','Kein Essen auf Herd oder Tisch','Zahnbürsten & Shampoo in den Schrank','Handtücher weglegen']},
     {h:'Balkon, Terrasse, Garten', p:'Einen einladenden Außenbereich schaffen.', list:['Aufräumen, Geräte beiseite','Aschenbecher & Flaschen weg','Gartenmöbel & Grill abdecken','Abdeckfolie vom Pool abnehmen','Kinderspielzeug wegräumen'], tip:'Zum Träumen verführen – das ist der Moment fürs Herobild.'},

/* ---------- Homescreen ---------- */
function progress(m){
  if(!m.checklist) return null;
  const total=m.checklist.reduce((a,g)=>a+g.items.length,0);
  const done=Object.values(store.get('cl3_'+m.id,{})).filter(Boolean).length;
  return Math.round(done/total*100);
}

let cur=null, startTab=null;
function openModule(id){

  } else {

    if(cur.calc) tabs.push(['rechner','Rechner']);
    tabs.push(['checkliste','Checkliste']);

}

function renderSteps(){
  const s=cur.steps;
  $('p-schritte').innerHTML=`<div class="steps" id="steps">${s.map((x,i)=>`
    <div class="step"><div class="num">${i+1}</div><h4>${x.h}</h4><p>${x.p}</p>
    ${x.list?`<ul>${x.list.map(l=>`<li>${l}</li>`).join('')}</ul>`:''}
    ${x.img?`<img class="step-img" src="${x.img}" alt="" loading="lazy" data-zoom>`:''}
    ${x.tip?`<div class="tip">💡 ${x.tip}</div>`:''}</div>`).join('')}</div>
    <div class="stepnav"><button class="btn light" id="prev">Zurück</button>
    <div class="sdots" id="sdots">${s.map(()=>'<span></span>').join('')}</div>
    <button class="btn" id="next">Weiter</button></div>`;
  const el=$('steps');
  const idx=()=>Math.round(el.scrollLeft/(el.clientWidth));
  const go=i=>el.scrollTo({left:i*(el.clientWidth),behavior:'smooth'});
  const paint=()=>{const i=idx();[...$('sdots').children].forEach((d,j)=>d.classList.toggle('on',j===i));
    $('prev').disabled=i===0;$('next').textContent=i===s.length-1?'Zur Checkliste':'Weiter'};
  el.addEventListener('scroll',()=>requestAnimationFrame(paint));
  $('prev').onclick=()=>go(idx()-1);
  $('next').onclick=()=>{const i=idx(); i===s.length-1?setTab('checkliste'):go(i+1)};
  paint();
}

let rooms=[];
const num=v=>{const n=parseFloat(String(v).replace(',','.'));return isFinite(n)&&n>=0?n:0};
const f2=n=>n.toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2});
function renderCalc(){
  $('p-rechner').innerHTML=`
  <div class="card"><h4>Raum mit Dachschräge</h4>
    <label class="fld"><span>Raumname</span><input id="cName" placeholder="z. B. Schlafzimmer"></label>
    <label class="fld"><span>Raumlänge entlang der Schräge (m)</span><input id="cL" inputmode="decimal" placeholder="4,20"></label>
    <label class="fld"><span>Raumtiefe gesamt, Wand zu Wand (m)</span><input id="cT" inputmode="decimal" placeholder="3,80"></label>
    <label class="fld"><span>Abstand 1-m-Linie zur Wand (m)</span><input id="cA1" inputmode="decimal" placeholder="0,30"></label>
    <label class="fld"><span>Abstand 2-m-Linie zur Wand (m)</span><input id="cA2" inputmode="decimal" placeholder="1,20"></label>
    <div class="seg" id="cSide"><button class="on" data-v="1">Schräge 1 Seite</button><button data-v="2">2 Seiten</button></div>
    <div class="res" id="cRes"></div>
    <button class="btn" style="width:100%;margin-top:12px" id="cAdd">Zur Liste hinzufügen</button>
  </div>
  <div class="card"><h4>Weitere Flächen</h4><p class="hint" style="margin-top:0">Balkon, Terrasse, Wintergarten oder Raum ohne Schräge</p>
    <label class="fld"><span>Bezeichnung</span><input id="bName" placeholder="z. B. Balkon"></label>
    <label class="fld"><span>Grundfläche (m²)</span><input id="bA" inputmode="decimal" placeholder="6,50"></label>
    <div class="seg" id="bF"><button class="on" data-v="0.25">25 %</button><button data-v="0.5">50 %</button><button data-v="1">100 %</button></div>
    <p class="hint">Balkon/Terrasse in der Regel 25 %, max. 50 %. Unbeheizter Wintergarten 50 %. Raum ohne Schräge: 100 %.</p>
    <button class="btn light" style="width:100%;margin-top:10px" id="bAdd">Zur Liste hinzufügen</button>
  </div>
  <div class="card"><h4>Liste</h4><div id="rList"></div></div>`;
  let side=1,bf=0.25;
  const calc=()=>{
    const L=num($('cL').value),T=num($('cT').value),a1=num($('cA1').value),a2=num($('cA2').value);
    if(!L||!T){$('cRes').innerHTML='<p class="hint">Werte eingeben – das Ergebnis erscheint hier.</p>';return null}
    if(a2<a1){$('cRes').innerHTML='<p class="warn">Die 2-m-Linie muss weiter von der Wand entfernt sein als die 1-m-Linie.</p>';return null}
    if(side*a2>T){$('cRes').innerHTML='<p class="warn">Die Abstände sind größer als die Raumtiefe – bitte prüfen.</p>';return null}
    const z0=side*a1*L,z50=side*(a2-a1)*L,z100=(T-side*a2)*L,wf=z100+z50/2;
    $('cRes').innerHTML=`<div class="rz"><span>0 % · unter 1 m</span><b>${f2(z0)} m²</b></div>
      <div class="rz"><span>50 % · 1–2 m</span><b>${f2(z50)} m² → ${f2(z50/2)} m²</b></div>
      <div class="rz"><span>100 % · ab 2 m</span><b>${f2(z100)} m²</b></div>

  $('bF').onclick=e=>{const b=e.target.closest('button');if(!b)return;bf=+b.dataset.v;[...$('bF').children].forEach(x=>x.classList.toggle('on',x===b))};
  $('cAdd').onclick=()=>{const wf=calc();if(wf==null)return;rooms.push({n:$('cName').value||'Raum '+(rooms.length+1),v:wf});['cName','cL','cT','cA1','cA2'].forEach(i=>$(i).value='');calc();list()};
  $('bAdd').onclick=()=>{const a=num($('bA').value);if(!a)return;rooms.push({n:($('bName').value||'Außenfläche')+' ('+(bf*100)+' %)',v:a*bf});$('bName').value='';$('bA').value='';list()};
  const list=()=>{
    $('rList').innerHTML=rooms.length?rooms.map((r,i)=>`<div class="rz"><span>${r.n}</span><b>${f2(r.v)} m² <button class="x" data-i="${i}">✕</button></b></div>`).join('')

      :'<p class="hint">Noch leer. Räume oben berechnen und hinzufügen.</p>';
  };
  $('rList').onclick=e=>{const x=e.target.closest('.x');if(x){rooms.splice(+x.dataset.i,1);list()}};
  calc();list();
}

const protoCount=()=>{const p=getProto();return ABSCHLUSS.filter((_,i)=>p.checks[i]).length};
let dlAPI=undefined;
const nativeDL={save:async({filename,data})=>{
  const file=new File([data],filename,{type:'application/pdf'});
  const touch=matchMedia('(pointer:coarse)').matches;
  if(touch&&navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file],title:filename});return {status:'saved'}}
    catch(e){if(e&&e.name==='AbortError')throw {code:'declined'}}
  }
  const u=URL.createObjectURL(data),a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);
  return {status:'saved'};
}};
(async()=>{try{dlAPI=window.claude&&claude.use?(await claude.use('downloads')):nativeDL}catch(e){dlAPI=nativeDL} if(cur&&cur.abschluss&&$('p-abschluss'))renderAbschluss()})();

   </div>
   <div class="cl-prog"><div class="bar"><i style="width:${done/ABSCHLUSS.length*100}%"></i></div><b>${done}/${ABSCHLUSS.length}</b></div>
   ${ABSCHLUSS.map((t,i)=>`<button class="check pchk ${p.checks[i]?'done':''}" data-i="${i}"><div class="box"><svg viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></svg></div><span>${t}</span></button>`).join('')}
   <label class="fld" style="margin-top:16px"><span>Notiz</span><textarea id="pNote" rows="5" placeholder="z. B. Garten bei Regen – Außenfotos beim Besichtigungstermin nachholen">${(p.note||'').replace(/</g,'&lt;')}</textarea></label>
   <div id="pMsg" class="hint"></div>
   ${dlAPI===null?'<p class="warn">PDF speichern ist in dieser Ansicht nicht verfügbar. Bitte die App direkt in claude.ai öffnen.</p>':''}
   <button class="btn yellow" style="width:100%;margin-top:12px" id="pPdf" ${dlAPI===null?'disabled':''}>PDF speichern</button>
   <button class="reset" id="pNew">Neues Protokoll beginnen</button>`;
  const save=()=>{const q=getProto();q.obj=$('pObj').value;q.by=$('pBy').value;q.note=$('pNote').value;if(!q.start&&(q.obj||q.note))q.start=Date.now();store.set('proto',q);store.set('name',q.by)};
  ['pObj','pBy','pNote'].forEach(i=>$(i).addEventListener('input',save));
  $('p-abschluss').onclick=async e=>{
    const c=e.target.closest('.pchk');
    if(c){save();const q=getProto();const i=c.dataset.i;q.checks[i]=!q.checks[i];if(!q.start)q.start=Date.now();
      const all=ABSCHLUSS.every((_,k)=>q.checks[k]);if(!all)q.auto=false;
      const fire=all&&!q.auto; if(fire)q.auto=true; store.set('proto',q); renderAbschluss();
      if(fire){$('pMsg').textContent='Alles erledigt – PDF wird erstellt …';makePdf()} return}
    if(e.target.id==='pPdf'){save();makePdf()}
    if(e.target.id==='pNew'){askReset('Neues Protokoll beginnen?','Objekt, Haken und Notiz werden geleert. Dein Name bleibt.',()=>{store.set('proto',{obj:'',by:store.get('name',''),start:null,checks:{},note:'',auto:false});renderAbschluss()})}
  };
}
function pdfText(t){return String(t||'').replace(/[–—]/g,'-').replace(/[„“”]/g,'"').replace(/[‚‘’]/g,"'").replace(/…/g,'...').replace(/[^\x00-\xFF€]/g,'')}
async function makePdf(){
  const msg=t=>{const m=$('pMsg');if(m)m.textContent=t};
  if(!window.jspdf){msg('PDF-Modul lädt noch – bitte gleich noch einmal tippen.');return}
  const p=getProto(), now=Date.now();
  const {jsPDF}=window.jspdf; const d=new jsPDF({unit:'mm',format:'a4'});
  const B=[20,55,88],Y=[247,192,71],G=[107,122,140];
  const W=210,M=18; let y=0;
  const footer=()=>{d.setFontSize(8);d.setTextColor(...G);d.text('Erstellt mit dem Immo360° Aufnahme-Guide · '+fmtDT(now),M,289);d.text('Seite '+d.getNumberOfPages(),W-M,289,{align:'right'})};
  const need=h=>{if(y+h>280){footer();d.addPage();y=20}};
  d.setFillColor(...B);d.rect(0,0,W,34,'F');d.setFillColor(...Y);d.rect(0,34,W,1.6,'F');
  d.setFont('helvetica','bold');d.setFontSize(22);d.setTextColor(255,255,255);d.text('Immo',M,17);
  const iw=d.getTextWidth('Immo');d.setTextColor(...Y);d.text('360°',M+iw,17);
  d.setFont('helvetica','normal');d.setFontSize(11);d.setTextColor(255,255,255);d.text('Aufnahme-Protokoll · Termin vor Ort',M,26);
  y=48;
  const row=(k,v)=>{d.setFont('helvetica','bold');d.setFontSize(10);d.setTextColor(...G);d.text(k,M,y);d.setFont('helvetica','normal');d.setFontSize(11);d.setTextColor(...B);const L=d.splitTextToSize(pdfText(v)||'-',W-2*M-45);d.text(L,M+45,y);y+=6*L.length+1};
  row('Objekt / Adresse',p.obj);row('Aufgenommen von',p.by);row('Begonnen',p.start?fmtDT(p.start):'-');row('Abgeschlossen',fmtDT(now));
  const n=ABSCHLUSS.filter((_,i)=>p.checks[i]).length;
  row('Status',n===ABSCHLUSS.length?'Alle Punkte erledigt':n+' von '+ABSCHLUSS.length+' Punkten erledigt');
  y+=4;d.setDrawColor(227,231,236);d.line(M,y,W-M,y);y+=10;
  d.setFont('helvetica','bold');d.setFontSize(13);d.setTextColor(...B);d.text('Checkliste',M,y);y+=8;
  ABSCHLUSS.forEach((t,i)=>{need(10);const ok=!!p.checks[i];
    if(ok){d.setFillColor(...Y);d.roundedRect(M,y-4.5,6,6,1.2,1.2,'F');d.setDrawColor(...B);d.setLineWidth(.7);d.line(M+1.3,y-1.6,M+2.6,y-.2);d.line(M+2.6,y-.2,M+4.8,y-3.2);d.setLineWidth(.2)}
    else{d.setDrawColor(201,210,220);d.setLineWidth(.5);d.roundedRect(M,y-4.5,6,6,1.2,1.2,'S');d.setLineWidth(.2)}
    d.setFont('helvetica','normal');d.setFontSize(11);d.setTextColor(...B);d.text(pdfText(t),M+10,y);
    d.setFont('helvetica','bold');d.setFontSize(9);d.setTextColor(...(ok?[46,125,50]:[178,59,42]));d.text(ok?'erledigt':'offen',W-M,y,{align:'right'});y+=9});
  y+=4;need(20);d.setFont('helvetica','bold');d.setFontSize(13);d.setTextColor(...B);d.text('Notiz',M,y);y+=7;
  d.setFont('helvetica','normal');d.setFontSize(11);d.setTextColor(43,69,96);
  const lines=d.splitTextToSize(pdfText(p.note)||'Keine Notiz.',W-2*M);
  lines.forEach(l=>{need(6);d.text(l,M,y);y+=5.6});
  footer();
  const slug=pdfText(p.obj).trim().replace(/[^A-Za-z0-9ÄÖÜäöüß]+/g,'-').replace(/^-|-$/g,'').slice(0,60)||'Objekt';
  const fn='Aufnahme_'+slug+'_'+new Date(now).toISOString().slice(0,10)+'.pdf';
  const blob=d.output('blob');
  if(!dlAPI){msg('PDF speichern ist in dieser Ansicht nicht verfügbar.');return}
  try{await dlAPI.save({filename:fn,data:blob});msg('Gespeichert: '+fn)}
  catch(err){const c=err&&err.code;msg(c==='declined'?'Speichern abgebrochen. Mit „PDF speichern“ jederzeit erneut.':c==='rate_limited'?'Ein Speichern-Dialog ist schon offen.':'Speichern hier nicht möglich ('+(c||'Fehler')+').')}
}
let resetCb=null;
function askReset(h,t,cb){$('dlgH').textContent=h;$('dlgP').textContent=t;resetCb=cb;$('dlg').classList.remove('hidden')}

function renderChecklist(){
  const st=store.get('cl3_'+cur.id,{});
  let total=0,done=0,html='';
  cur.checklist.forEach((g,gi)=>{
    html+=`<div class="group">${g.g}</div>`;
    g.items.forEach((it,ii)=>{const k=gi+'_'+ii,on=!!st[k];total++;if(on)done++;
      html+=`<button class="check ${on?'done':''}" data-k="${k}"><div class="box"><svg viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></svg></div><span>${it}</span></button>`});
  });
  $('p-checkliste').innerHTML=`<div class="cl-prog"><div class="bar"><i style="width:${done/total*100}%"></i></div><b>${done}/${total}</b></div>${html}<button class="reset" id="reset">Checkliste zurücksetzen</button>`;
  $('p-checkliste').onclick=e=>{
    const c=e.target.closest('.check');
    if(c){st[c.dataset.k]=!st[c.dataset.k];store.set('cl3_'+cur.id,st);renderChecklist();return}
    if(e.target.id==='reset') askReset('Checkliste zurücksetzen?','Alle Haken in diesem Modul werden entfernt – praktisch für den nächsten Termin.',()=>{store.set('cl3_'+cur.id,{});renderChecklist()});
  };
}
$('dlgNo').onclick=()=>$('dlg').classList.add('hidden');
$('dlgYes').onclick=()=>{$('dlg').classList.add('hidden');if(resetCb)resetCb();resetCb=null};
renderHome();
</script>
