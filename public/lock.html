<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#143758">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Immo360°">
<title>Immo360° Aufnahme-Guide</title>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root{--blue:#143758;--yellow:#F7C047;--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#0d2238;font-family:"Source Sans 3",system-ui,sans-serif}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
#app{position:relative;max-width:440px;height:100%;margin:0 auto;overflow:hidden}
@media(min-width:600px){#app{height:min(900px,calc(100% - 40px));margin-top:20px;border-radius:36px;box-shadow:0 30px 80px rgba(0,0,0,.35)}}
#lock{position:absolute;inset:0;display:flex;flex-direction:column;background:radial-gradient(120% 80% at 50% 0%,#24557f 0%,var(--blue) 55%,#0c2640 100%);color:#fff;align-items:center;padding:calc(var(--st) + 48px) 24px calc(var(--sb) + 28px)}
.brand{font-weight:600;letter-spacing:.18em;font-size:13px;opacity:.75;text-transform:uppercase}
.brand b{color:var(--yellow)}
.time{font-size:84px;font-weight:300;line-height:1;margin-top:18px;letter-spacing:-.02em}
.date{font-size:17px;opacity:.8;margin-top:6px}
.hint{margin-top:auto;font-size:15px;opacity:.85;min-height:20px;text-align:center}
.dots{display:flex;gap:14px;margin:16px 0 30px}
.dots span{width:13px;height:13px;border-radius:50%;border:1.5px solid rgba(255,255,255,.85);transition:background .15s}
.dots span.on{background:#fff}
.dots.err{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.pad{display:grid;grid-template-columns:repeat(3,78px);gap:16px 26px}
.key{width:78px;height:78px;border-radius:50%;background:rgba(255,255,255,.12);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:32px;font-weight:300;transition:background .1s}
.key:active{background:rgba(255,255,255,.32)}
.key small{font-size:9px;letter-spacing:.2em;font-weight:600;opacity:.7;margin-top:-2px}
.key.ghost{background:none;font-size:16px;font-weight:400}
.busy .pad{opacity:.5;pointer-events:none}
</style>
</head>
<body>
<div id="app"><section id="lock">
  <div class="brand">Immo<b>360°</b> · Aufnahme-Guide</div>
  <div class="time" id="t">--:--</div>
  <div class="date" id="d"></div>
  <div class="hint" id="hint">Code eingeben</div>
  <div class="dots" id="dots"></div>
  <div class="pad" id="pad"></div>
</section></div>
<script>
const LEN=6, $=id=>document.getElementById(id);
let code='';
function clock(){const n=new Date();$('t').textContent=n.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});$('d').textContent=n.toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long'})}
clock();setInterval(clock,10000);
$('dots').innerHTML='<span></span>'.repeat(LEN);
const L={2:'ABC',3:'DEF',4:'GHI',5:'JKL',6:'MNO',7:'PQRS',8:'TUV',9:'WXYZ'};
$('pad').innerHTML=[1,2,3,4,5,6,7,8,9].map(n=>`<button class="key" data-k="${n}">${n}<small>${L[n]||'&nbsp;'}</small></button>`).join('')+'<span></span><button class="key" data-k="0">0</button><button class="key ghost" data-k="del">Löschen</button>';
const paint=()=>[...$('dots').children].forEach((s,i)=>s.classList.toggle('on',i<code.length));
function press(v){if(document.body.classList.contains('busy'))return;if(v==='del')code=code.slice(0,-1);else if(code.length<LEN)code+=v;paint();if(code.length===LEN)submit()}
$('pad').addEventListener('click',e=>{const k=e.target.closest('.key');if(k)press(k.dataset.k)});
document.addEventListener('keydown',e=>{if(/^[0-9]$/.test(e.key))press(e.key);if(e.key==='Backspace')press('del')});
async function submit(){
  document.body.classList.add('busy');$('hint').textContent='Prüfe …';
  let r;try{r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pin:code}),credentials:'same-origin'})}catch(e){r=null}
  if(r&&r.ok){location.replace('/');return}
  $('dots').classList.add('err');
  $('hint').textContent=!r?'Keine Verbindung':r.status===429?'Zu viele Versuche – bitte später erneut':'Falscher Code';
  setTimeout(()=>{$('dots').classList.remove('err');code='';paint();document.body.classList.remove('busy');if(r&&r.status===401)$('hint').textContent='Code eingeben'},r&&r.status===401?900:2500);
}
</script>
</body>
</html>
